<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Asror Botirov - Frontend Developer, UI Designer and Digital Creator.">
    <title>Asror Botirov | Profile</title>
    
    <!-- Google Fonts: Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables */
        :root {
            --bg-black: #000000;
            --accent-blue: #3b82f6;
            --accent-sky: #60a5fa;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Hide scrollbar for clean mobile look */
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Background Effects */
        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-fx .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: floatBlob 10s ease-in-out infinite;
        }
        .bg-fx .blob-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-blue);
            top: -100px;
            left: -100px;
        }
        .bg-fx .blob-2 {
            width: 250px;
            height: 250px;
            background: var(--accent-sky);
            bottom: 10%;
            right: -100px;
            animation-delay: 2s;
        }

        /* Mobile Container */
        .mobile-container {
            width: 100%;
            max-width: 430px; /* Mobile only constraint */
            padding: 40px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-sky));
            margin-bottom: 20px;
            animation: floatProfile 4s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #000;
            background-color: #111;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #bfdbfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 320px;
        }

        /* Glass Cards (Contacts) */
        .contacts-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 50px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, background 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .glass-card.visible {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Shine Effect */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s ease;
        }
        .glass-card:active::before {
            left: 100%;
        }
        .glass-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.06);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            color: var(--accent-sky);
        }

        .card-content h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .card-content p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Gallery */
        .gallery-section {
            width: 100%;
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent-blue);
            border-radius: 2px;
            display: block;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            padding-bottom: 100%; /* Square aspect ratio */
            border-radius: 16px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
        }

        .gallery-item.visible {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:active img {
            transform: scale(1.1);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.active img {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* Animations */
        @keyframes floatProfile {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 30px) scale(1.1); }
        }

        /* SVG Icons */
        .icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- Background Gradient Accents -->
    <div class="bg-fx">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="mobile-container">
        
        <!-- Header -->
        <header>
            <div class="profile-img-container">
                <!-- Image loads from project folder -->
                <img src="profile.jpg" alt="Asror Botirov" class="profile-img" onerror="this.src='https://via.placeholder.com/150/000000/FFFFFF?text=Profile';">
            </div>
            <h1>Asror Botirov</h1>
            <p class="description">
                «Frontend Developer, UI Designer and Digital Creator. I build modern websites and digital solutions with clean design and smooth user experience.»
            </p>
        </header>

        <!-- Contacts -->
        <div class="contacts-section" id="contacts">
            <!-- Instagram -->
            <a href="https://www.instagram.com/asror.botir0v?igsh=anMzaDE1YzRwZm51" target="_blank" class="glass-card">
                <div class="card-icon">
                    <svg class="icon" viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Instagram</h2>
                    <p>@asror.botir0v</p>
                </div>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/asrorbotirov" target="_blank" class="glass-card">
                <div class="card-icon">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M21.5 4.5L2.5 12.5l6 2 2 6 3.5-4.5 5 4.5z"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Telegram</h2>
                    <p>@asrorbotirov</p>
                </div>
            </a>

            <!-- Phone -->
            <a href="tel:+998983109929" class="glass-card">
                <div class="card-icon">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <h2>Phone</h2>
                    <p>+998 98 310 99 29</p>
                </div>
            </a>
        </div>

        <!-- Gallery -->
        <div class="gallery-section">
            <div class="section-title">Gallery</div>
            <div class="gallery-grid" id="gallery">
                <!-- Images load automatically from project folder -->
                <div class="gallery-item" onclick="openLightbox('1.jpg')">
                    <img src="1.jpg" alt="Gallery Image 1" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=1';">
                </div>
                <div class="gallery-item" onclick="openLightbox('2.jpg')">
                    <img src="2.jpg" alt="Gallery Image 2" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=2';">
                </div>
                <div class="gallery-item" onclick="openLightbox('3.jpg')">
                    <img src="3.jpg" alt="Gallery Image 3" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=3';">
                </div>
                <div class="gallery-item" onclick="openLightbox('4.jpg')">
                    <img src="4.jpg" alt="Gallery Image 4" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=4';">
                </div>
                <div class="gallery-item" onclick="openLightbox('5.jpg')">
                    <img src="5.jpg" alt="Gallery Image 5" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=5';">
                </div>
                <div class="gallery-item" onclick="openLightbox('6.jpg')">
                    <img src="6.jpg" alt="Gallery Image 6" onerror="this.src='https://via.placeholder.com/300/111111/3b82f6?text=6';">

            </div>
        </div>

        <!-- Footer -->
        <footer>
            © 2026 Asror Botirov
        </footer>

    </div>

    <!-- Lightbox Container -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="close-btn">&times;</div>
        <img src="" id="lightbox-img" alt="Fullscreen Image">
    </div>

    <script>
        // Lightbox Logic
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            
            // Handle image not found gracefully in lightbox
            img.onerror = function() {
                this.src = 'https://via.placeholder.com/800/000000/FFFFFF?text=Image+Not+Found';
            };
            
            img.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Scroll Reveal Animation Logic
        document.addEventListener("DOMContentLoaded", () => {
            const items = document.querySelectorAll('.glass-card, .gallery-item');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        // Add a slight delay for staggered effect
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, index * 50);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            items.forEach(item => {
                observer.observe(item);
            });
        });
    </script>
